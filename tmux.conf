set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:RGB"

# Forward modified keys (Shift+Enter, Ctrl+Enter, ...) to apps that ask for them
set -s extended-keys on
set -as terminal-features ",xterm-kitty:extkeys"

# Let apps talk to the outer terminal directly (kitty graphics in nvim/yazi)
set -g allow-passthrough on

# Copy to the system clipboard via OSC 52 (works over SSH too)
set -g set-clipboard on

# Use vi keybindings in copy and choice modes
setw -g mode-keys vi

# Enable focus events (needed for vim/neovim autoread)
set -g focus-events on

# Scroll history
set -g history-limit 100000
set -g display-panes-time 2000
set -g word-separators " -_@"

# Renumber windows sequentially after closing any of them
set -g renumber-windows on

# Switch to another session instead of exiting when a session is destroyed
set -g detach-on-destroy off

# Place status on top
set-option -g status-position top

# Status bar
set -g status-interval 2

# Automatically set window title
setw -g automatic-rename

# Titles (window number, program name, active (or not)
set -g set-titles on
set -g set-titles-string '#H:#S.#I.#P #W #T'

# Pane resize in all four directions using vi bindings.
# can use these raw but I map them to shift-ctrl-<h,j,k,l> in iTerm.
bind-key J resize-pane -D 12
bind-key K resize-pane -U 12
bind-key H resize-pane -L 14
bind-key L resize-pane -R 14

# Quick pane cycling
unbind ^S
bind ^S select-pane -t:.+

# Toggle synchronization (mnemonic: e is for echo)
# sends input to all panes in a given window
bind e setw synchronize-panes

# Set first window and pane to index 1 (not 0)
# to map more to the keyboard layout
set -g base-index 1
set -g pane-base-index 1

# Enable mouse
set -g mouse on

# Vi style copy&paste (tmux-yank handles clipboard integration)
bind C-Space copy-mode

unbind p
bind p paste-buffer

# Setup 'v' to begin selection as in Vim
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi Escape send -X cancel
bind-key -Tcopy-mode-vi V send -X rectangle-toggle

# Jump between shell prompts (needs OSC 133 marks, see shell/osc133.zsh)
bind-key -Tcopy-mode-vi '[' send -X previous-prompt
bind-key -Tcopy-mode-vi ']' send -X next-prompt

# vim-style hybrid line numbers in copy mode (absolute current, relative others)
set -g copy-mode-line-numbers hybrid

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Horizontal and vertical splits
bind j split-window -v -c "#{pane_current_path}"
bind l split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Killing window/pane
bind-key q confirm-before -p "kill-window #W? (y/n)" kill-window
bind-key x kill-pane

# Maximize active pane
bind C-h resize-pane -Z

# Quick window navigation
bind -n M-p previous-window
bind -n M-n next-window
# On tmux 3.8+ prefix+Tab / prefix+S-Tab are the built-in fuzzy window /
# session switcher (switch-mode); older versions keep Tab for the last window.
%if #{<:#{version},3.8}
bind Tab last-window
%endif

# Enter copy mode and start a vi-style incremental search
bind / copy-mode \; send-keys '/'

# Pane resizing
bind Right resize-pane -R 8
bind Left resize-pane -L 8
bind Up resize-pane -U 8
bind Down resize-pane -D 8

# Rebind prefix
unbind C-b
set -g prefix C-Space
bind Space send-prefix

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Restore screen clearing
bind C-l send-keys 'C-l'

# Layout
unbind =
bind = select-layout tiled

# Switching between layouts
bind o select-layout "main-vertical"
bind | select-layout "even-horizontal"
bind r rotate-window

# Path of this file (usually a symlink into the repo), to find repo scripts
set -gF @tmux_conf '#{current_file}'

# -------------------------------------------------------------------------------
# tmux 3.8+
# -------------------------------------------------------------------------------
%if #{>=:#{version},3.8}
# Use the terminal's ANSI palette for built-in styles; kitty already carries
# the Omarchy colors, and omarchy/tmux-theme.sh styles the rest explicitly.
set -g theme terminal

# Scrollbars overlay the pane and show up only while scrolling or hovered
set -g pane-scrollbars auto-hide

# Keep copy mode live: new output keeps appearing while you scroll back
# (it follows only at the bottom and pauses during a selection)
set-hook -g pane-mode-entered {
  if -F '#{==:#{pane_mode},copy-mode}' { send -X refresh-on }
}

# Desktop notification when a command that ran 10s+ finishes in a window you
# aren't looking at (needs OSC 133 marks, see shell/osc133.zsh)
set-hook -g pane-command-finished {
  run -b 'sh "$(dirname "$(readlink -f "#{@tmux_conf}")")/scripts/notify-command-finished.sh" "#{hook_pane}"'
}
%endif

# Plugin configs

# -------------------------------------------------------------------------------
# jimeh/tmux-themepack
# -------------------------------------------------------------------------------
# set -g @themepack 'basic'
# set -g @themepack 'powerline/double/yellow'
# set -g @themepack 'powerline/default/gray'
# set -g @themepack 'powerline/block/gray'

# -------------------------------------------------------------------------------
# rose-pine/tmux
# -------------------------------------------------------------------------------
# set -g @rose_pine_variant 'main'

# -------------------------------------------------------------------------------
# fabioluciano/tmux-tokyo-night
# -------------------------------------------------------------------------------
# set -g @theme_variation 'night'
# set -g @theme_plugin_weather_location 'Moscow, Russia'

# -------------------------------------------------------------------------------
# erikw/tmux-dark-notify
# -------------------------------------------------------------------------------
set -g @dark-notify-theme-path-light '$HOME/.tmux/themes/inspired_github.tmux.conf'
# set -g @dark-notify-theme-path-light '$HOME/.tmux/themes/tomorrow_light.tmux.conf'
set -g @dark-notify-theme-path-dark '$HOME/.tmux/themes/tomorrow_night.tmux.conf'

# -------------------------------------------------------------------------------
# AngryMorrocoy/tmux-neolazygit
# -------------------------------------------------------------------------------
set -g @open-lazygit 'G'

# -------------------------------------------------------------------------------
# laktak/extrakto
# -------------------------------------------------------------------------------
# Default key is Tab, which belongs to last-window / switch-mode here
set -g @extrakto_key 'u'
set -g @extrakto_filter_order "line url word"
set -g @extrakto_popup_size 50%

# -------------------------------------------------------------------------------
# noscript/tmux-mighty-scroll
# -------------------------------------------------------------------------------
set -g @mighty-scroll-by-line "man less pager fzf node claude"
set -g @mighty-scroll-pass-through "vim nvim"
set -g @mighty-scroll-fallback-mode "history"

# -------------------------------------------------------------------------------
# tmux-plugins/tmux-resurrect + tmux-plugins/tmux-continuum
# -------------------------------------------------------------------------------
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# -------------------------------------------------------------------------------
# omerxx/tmux-sessionx
# -------------------------------------------------------------------------------
set -g @sessionx-bind 'C-a'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-preview-enabled 'true'
# Send queries that match no session to zoxide and open a session there
set -g @sessionx-zoxide-mode 'on'

# -------------------------------------------------------------------------------
# raine/workmux (CLI, not a TPM plugin; config in workmux/config.yaml)
# -------------------------------------------------------------------------------
# Jump to the agent that finished or is waiting for input (repeat to cycle)
bind a run-shell "workmux last-done"
# Dashboard of all agents
bind W display-popup -E -w 90% -h 80% "workmux dashboard"
# Live agent status sidebar (toggle)
bind C-t run-shell "workmux sidebar"

# -------------------------------------------------------------------------------
# omerxx/tmux-floax
# -------------------------------------------------------------------------------
# Floating scratch terminal; Alt+t toggles it, prefix+P opens its menu.
# Border colors follow the Omarchy theme (see omarchy/tmux-theme.sh).
set -g @floax-bind '-n M-t'
set -g @floax-bind-menu 'P'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-change-path 'true'

# List of TMP plugins
set -g @tpm_plugins '              \
    tmux-plugins/tpm               \
    tmux-plugins/tmux-sensible     \
    tmux-plugins/tmux-yank         \
    christoomey/vim-tmux-navigator \
    jaclu/tmux-menus               \
    laktak/extrakto                \
    AngryMorrocoy/tmux-neolazygit  \
    noscript/tmux-mighty-scroll    \
    tmux-plugins/tmux-resurrect    \
    tmux-plugins/tmux-continuum    \
    omerxx/tmux-sessionx           \
    omerxx/tmux-floax              \
'

# tmux-dark-notify relies on macOS appearance notifications, so load it only there.
if-shell '[ "$(uname)" = Darwin ]' \
    "set -ga @tpm_plugins ' erikw/tmux-dark-notify'"

# Disabled but good plugins
# - fabioluciano/tmux-tokyo-night
# - janoamaral/tokyo-night-tmux
# - rose-pine/tmux
# - jimeh/tmux-themepack

# Theme
# Sourced before TPM: tmux-continuum prepends its auto-save hook to
# status-right when it loads, so the theme must not overwrite it afterwards.
# On Omarchy (Linux) the tmux palette follows the active Omarchy theme. The
# theme-set/post-boot hook at ~/.config/omarchy/hooks/theme-set.d/tmux writes
# ~/.local/state/tmux/omarchy-theme.conf. Generate it on demand if missing,
# then load it.
if-shell "test -x ~/.config/omarchy/hooks/theme-set.d/tmux && { test -e ~/.local/state/tmux/omarchy-theme.conf || ~/.config/omarchy/hooks/theme-set.d/tmux; }" \
     "source-file ~/.local/state/tmux/omarchy-theme.conf"

# Fallback for macOS: tmux-dark-notify's generated theme.
if-shell "test ! -x ~/.config/omarchy/hooks/theme-set.d/tmux && test -e ~/.local/state/tmux/tmux-dark-notify-theme.conf" \
     "source-file ~/.local/state/tmux/tmux-dark-notify-theme.conf"

# Install plugins automatically
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
